<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        var isExt = function (s) {
          return (
            typeof s === 'string' &&
            (s.indexOf('chrome-extension://') !== -1 ||
              s.indexOf('moz-extension://') !== -1 ||
              s.indexOf('Failed to connect to MetaMask') !== -1)
          );
        };
        window.addEventListener(
          'error',
          function (e) {
            var stack = e.error && e.error.stack ? e.error.stack : '';
            if (isExt(e.filename) || isExt(e.message) || isExt(stack)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true,
        );
        window.addEventListener(
          'unhandledrejection',
          function (e) {
            var r = e.reason;
            var msg = r instanceof Error ? r.message + '\n' + (r.stack || '') : String(r || '');
            if (isExt(msg)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true,
        );
      })();
    </script>
